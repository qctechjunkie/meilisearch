services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    ports:
      - "${PORT:-7700}:7700"
    environment:
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ${DOCKER_DATA_PATH}/meili_data:/meili_data
    restart: unless-stopped
  meilisearch-ui:
    image: eyeix/meilisearch-ui:latest
    container_name: meilisearch-ui
    environment:
      - SINGLETON_MODE=true
      - SINGLETON_HOST=http://192.168.1.91:7700/
      - SINGLETON_API_KEY=${MEILI_MASTER_KEY}
    ports:
      - "24900:24900"
    restart: unless-stopped
